<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mappa Catasto & Vincoli - Val Camonica</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1a1a1a;
      color: #333;
    }
    #map {
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    
    .top-bar {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 1000;
      display: flex;
      gap: 8px;
      align-items: center;
      pointer-events: none;
    }
    .top-badge {
      pointer-events: auto;
      background: rgba(255, 255, 255, 0.95);
      padding: 8px 14px;
      border-radius: 24px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.18);
      font-size: 13px;
      font-weight: 600;
      color: #1e293b;
      display: flex;
      align-items: center;
      gap: 6px;
      backdrop-filter: blur(8px);
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
    }
    .quick-comuni-select {
      pointer-events: auto;
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid #cbd5e1;
      border-radius: 20px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      color: #0f172a;
      outline: none;
      box-shadow: 0 4px 14px rgba(0,0,0,0.15);
    }

    .fab-container {
      position: absolute;
      bottom: 24px;
      right: 16px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .fab-btn {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: none;
      background: #ffffff;
      color: #0f172a;
      box-shadow: 0 4px 16px rgba(0,0,0,0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .fab-btn:active {
      transform: scale(0.92);
    }
    .fab-btn.gps-active {
      background: #2563eb;
      color: #fff;
    }
    .fab-btn svg {
      width: 24px;
      height: 24px;
      fill: currentColor;
    }

    .drawer {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      max-height: 75vh;
      background: rgba(255, 255, 255, 0.98);
      border-top-left-radius: 22px;
      border-top-right-radius: 22px;
      box-shadow: 0 -8px 24px rgba(0,0,0,0.22);
      z-index: 1050;
      transform: translateY(105%);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .drawer.open {
      transform: translateY(0);
    }
    .drawer-header {
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #e2e8f0;
    }
    .drawer-title {
      font-size: 16px;
      font-weight: 700;
      color: #0f172a;
    }
    .drawer-close {
      background: transparent;
      border: none;
      font-size: 22px;
      color: #64748b;
      cursor: pointer;
      padding: 4px 8px;
    }
    .drawer-content {
      padding: 16px 20px 30px;
      overflow-y: auto;
    }
    
    .layer-group-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #64748b;
      font-weight: 700;
      margin: 14px 0 8px;
    }
    .layer-item {
      display: flex;
      flex-direction: column;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 10px 12px;
      margin-bottom: 8px;
    }
    .layer-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .layer-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .layer-name {
      font-size: 14px;
      font-weight: 600;
      color: #1e293b;
    }
    .layer-tag {
      font-size: 11px;
      color: #64748b;
    }
    .layer-slider-row {
      margin-top: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 11px;
      color: #64748b;
    }
    .layer-slider-row input[type="range"] {
      flex: 1;
      accent-color: #2563eb;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
      flex-shrink: 0;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #cbd5e1;
      transition: .25s;
      border-radius: 24px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .25s;
      border-radius: 50%;
    }
    input:checked + .slider { background-color: #2563eb; }
    input:checked + .slider:before { transform: translateX(20px); }

    .toast {
      position: absolute;
      top: 70px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: #0f172a;
      color: #fff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 12px;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s ease;
      z-index: 2000;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .badge-tag {
      display: inline-block;
      font-size: 10px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
      margin-right: 4px;
      margin-bottom: 4px;
    }
    .badge-catasto { background: #dbeafe; color: #1e40af; }
    .badge-vincolo-warn { background: #fee2e2; color: #991b1b; }
    .badge-vincolo-ok { background: #dcfce7; color: #166534; }
    .badge-paesaggio { background: #fef3c7; color: #92400e; }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="top-badge">
      <span class="status-dot"></span>
      <span id="zone-status">Valle Camonica</span>
    </div>
    <select id="comuniSelect" class="quick-comuni-select" onchange="jumpToComune(this.value)">
      <option value="" disabled selected>Comuni...</option>
      <option value="darfo">Darfo Boario T.</option>
      <option value="angolo">Angolo Terme</option>
      <option value="artogne">Artogne</option>
      <option value="gianico">Gianico</option>
      <option value="piancamuno">Pian Camuno</option>
      <option value="esine">Esine</option>
    </select>
  </div>

  <div id="toast" class="toast">Notifica</div>
  <div id="map"></div>

  <div class="fab-container">
    <button class="fab-btn" id="btn-gps" title="Seguimi (GPS)" onclick="toggleGPS()">
      <svg viewBox="0 0 24 24"><path d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm8.94 3A8.994 8.994 0 0 0 13 3.06V1h-2v2.06A8.994 8.994 0 0 0 3.06 11H1v2h2.06A8.994 8.994 0 0 0 11 20.94V23h2v-2.06A8.994 8.994 0 0 0 20.94 13H23v-2h-2.06zM12 19c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/></svg>
    </button>
    <button class="fab-btn" title="Gestione Livelli" onclick="toggleDrawer()">
      <svg viewBox="0 0 24 24"><path d="M11.99 18.54l-7.37-5.73L3 14.07l9 7 9-7-1.63-1.27-7.38 5.74zM12 16l7.36-5.73L21 9.01l-9-7-9 7 1.63 1.27L12 16z"/></svg>
    </button>
  </div>

  <div class="drawer" id="layerDrawer">
    <div class="drawer-header">
      <div class="drawer-title">Livelli Cartografici</div>
      <button class="drawer-close" onclick="toggleDrawer()">&times;</button>
    </div>
    <div class="drawer-content">
      <div class="layer-group-title">Sfondo</div>
      <div class="layer-item">
        <div class="layer-row">
          <span class="layer-name">OpenStreetMap</span>
          <input type="radio" name="baseMap" value="osm" checked onchange="switchBaseMap('osm')">
        </div>
      </div>
      <div class="layer-item">
        <div class="layer-row">
          <span class="layer-name">Ortofoto Satellitare</span>
          <input type="radio" name="baseMap" value="sat" onchange="switchBaseMap('sat')">
        </div>
      </div>

      <div class="layer-group-title">Catasto Agenzia Entrate</div>
      <div class="layer-item">
        <div class="layer-row">
          <div class="layer-info">
            <span class="layer-name">Particelle, Fogli e Numeri</span>
            <span class="layer-tag">Include vestizioni e testi mappale</span>
          </div>
          <label class="switch">
            <input type="checkbox" id="toggle-catasto" checked onchange="toggleLayer('catasto', this.checked)">
            <span class="slider"></span>
          </label>
        </div>
        <div class="layer-slider-row">
          <span>Opacit&agrave;</span>
          <input type="range" min="0.2" max="1" step="0.05" value="0.9" oninput="setLayerOpacity('catasto', this.value)">
        </div>
      </div>

      <div class="layer-group-title">Vincoli Territoriali</div>
      <div class="layer-item">
        <div class="layer-row">
          <span class="layer-name">PAI / Difesa Suolo</span>
          <label class="switch">
            <input type="checkbox" id="toggle-pai" checked onchange="toggleLayer('pai', this.checked)">
            <span class="slider"></span>
          </label>
        </div>
        <div class="layer-slider-row">
          <span>Opacit&agrave;</span>
          <input type="range" min="0.1" max="1" step="0.05" value="0.6" oninput="setLayerOpacity('pai', this.value)">
        </div>
      </div>

      <div class="layer-item">
        <div class="layer-row">
          <span class="layer-name">Vincolo Paesaggistico (Art. 142)</span>
          <label class="switch">
            <input type="checkbox" id="toggle-paesaggio" checked onchange="toggleLayer('paesaggio', this.checked)">
            <span class="slider"></span>
          </label>
        </div>
        <div class="layer-slider-row">
          <span>Opacit&agrave;</span>
          <input type="range" min="0.1" max="1" step="0.05" value="0.6" oninput="setLayerOpacity('paesaggio', this.value)">
        </div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const COMUNI = {
      darfo: { name: 'Darfo Boario Terme', belfiore: 'D251', coords: [45.8824, 10.1837] },
      angolo: { name: 'Angolo Terme', belfiore: 'A293', coords: [45.8913, 10.1472] },
      artogne: { name: 'Artogne', belfiore: 'A451', coords: [45.8504, 10.1631] },
      gianico: { name: 'Gianico', belfiore: 'E010', coords: [45.8647, 10.1741] },
      piancamuno: { name: 'Pian Camuno', belfiore: 'G546', coords: [45.8441, 10.1517] },
      esine: { name: 'Esine', belfiore: 'D434', coords: [45.9238, 10.2505] }
    };

    const map = L.map('map', { zoomControl: false, maxZoom: 21 }).setView([45.8824, 10.1837], 17);
    L.control.zoom({ position: 'topright' }).addTo(map);

    const osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 21 }).addTo(map);
    const satLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 21 });

    // WMS Catasto Ufficiale con il layer vestizioni (numeri mappale) e piastrelle 512px
    const catastoLayer = L.tileLayer.wms('https://wms.cartografia.agenziaentrate.gov.it/inspire/wms/owl01/service', {
      layers: 'CP.CadastralZoning,CP.CadastralParcel,fabbricati,vestizioni',
      format: 'image/png',
      transparent: true,
      opacity: 0.9,
      version: '1.3.0',
      crs: L.CRS.EPSG3857,
      maxZoom: 21,
      tileSize: 512
    }).addTo(map);

    const paiLayer = L.tileLayer.wms('https://www.cartografia.regione.lombardia.it/arcgis/services/wms/difesa_suolo_wms/MapServer/WMSServer', {
      layers: '0,1,2,3',
      format: 'image/png',
      transparent: true,
      opacity: 0.6,
      version: '1.3.0',
      crs: L.CRS.EPSG3857
    }).addTo(map);

    const paesaggioLayer = L.tileLayer.wms('https://www.cartografia.regione.lombardia.it/arcgis/services/wms/paesaggio_wms/MapServer/WMSServer', {
      layers: '0,1,2',
      format: 'image/png',
      transparent: true,
      opacity: 0.6,
      version: '1.3.0',
      crs: L.CRS.EPSG3857
    }).addTo(map);

    const layersMap = { catasto: catastoLayer, pai: paiLayer, paesaggio: paesaggioLayer };

    function switchBaseMap(type) {
      if (type === 'sat') {
        map.removeLayer(osmLayer); satLayer.addTo(map); satLayer.bringToBack();
      } else {
        map.removeLayer(satLayer); osmLayer.addTo(map); osmLayer.bringToBack();
      }
    }

    function toggleLayer(id, isChecked) {
      const l = layersMap[id];
      if (!l) return;
      if (isChecked) l.addTo(map); else map.removeLayer(l);
    }

    function setLayerOpacity(id, val) {
      const l = layersMap[id];
      if (l && l.setOpacity) l.setOpacity(parseFloat(val));
    }

    function jumpToComune(key) {
      const target = COMUNI[key];
      if (target) {
        map.flyTo(target.coords, 18, { duration: 1.2 });
        document.getElementById('zone-status').innerText = target.name;
      }
    }

    function toggleDrawer() {
      document.getElementById('layerDrawer').classList.toggle('open');
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.innerText = msg; toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }

    function getNearestComune(lat, lng) {
      let nearest = null; let minDist = Infinity;
      for (const k in COMUNI) {
        const c = COMUNI[k];
        const d = Math.hypot(c.coords[0] - lat, c.coords[1] - lng);
        if (d < minDist) { minDist = d; nearest = c; }
      }
      return nearest;
    }

    map.on('click', function(e) {
      const lat = e.latlng.lat.toFixed(6);
      const lng = e.latlng.lng.toFixed(6);
      const com = getNearestComune(e.latlng.lat, e.latlng.lng);
      const curZoom = map.getZoom();

      const zoomTip = curZoom < 18 
        ? `<div style="background:#eff6ff; color:#1e40af; padding:6px; border-radius:6px; margin:6px 0; font-size:11px;">
             <strong>Zoom attuale: ${curZoom}</strong><br>
             Ingrandisci a livello 18 o 19 per leggere nitidamente i numeri stampati dei mappali.
           </div>`
        : `<div style="color:#059669; font-size:11px; margin:4px 0;">&#10003; Zoom ottimale per lettura mappale a schermo.</div>`;

      const content = `
        <div style="font-size:12px; line-height:1.4; min-width:230px;">
          <div style="font-weight:700; font-size:13px; color:#0f172a; border-bottom:1px solid #e2e8f0; padding-bottom:4px; margin-bottom:6px;">
            ${com ? com.name : 'Punto selezionato'}
          </div>
          <div style="font-family:monospace; color:#475569; font-size:11px;">Coord: ${lat}, ${lng}</div>
          ${com ? `<div style="font-size:11px; color:#64748b;">Codice Catastale: <strong>${com.belfiore}</strong></div>` : ''}
          
          ${zoomTip}

          <div style="margin-top:8px; border-top:1px solid #e2e8f0; padding-top:6px;">
            <span class="badge-tag badge-catasto">Catasto Attivo</span>
            <span class="badge-tag badge-paesaggio">Vincolo Paesaggistico</span>
          </div>

          <div style="margin-top:8px;">
            <a href="https://geoportale.cartografia.agenziaentrate.gov.it/" target="_blank" style="color:#2563eb; text-decoration:none; font-weight:600; font-size:11px;">
              Consulta Geoportale AdE &rarr;
            </a>
          </div>
        </div>
      `;

      L.popup().setLatLng(e.latlng).setContent(content).openOn(map);
    });

    let gpsWatchId = null;
    let userMarker = null;

    function toggleGPS() {
      const btn = document.getElementById('btn-gps');
      if (gpsWatchId !== null) {
        navigator.geolocation.clearWatch(gpsWatchId);
        gpsWatchId = null;
        btn.classList.remove('gps-active');
        if (userMarker) map.removeLayer(userMarker);
        showToast('GPS disattivato');
        return;
      }
      btn.classList.add('gps-active');
      showToast('Acquisizione GPS...');
      gpsWatchId = navigator.geolocation.watchPosition(
        pos => {
          const latlng = [pos.coords.latitude, pos.coords.longitude];
          if (!userMarker) {
            userMarker = L.circleMarker(latlng, { radius: 9, fillColor: '#2563eb', color: '#fff', weight: 3, fillOpacity: 1 }).addTo(map);
            map.setView(latlng, 19);
          } else {
            userMarker.setLatLng(latlng);
          }
        },
        err => { showToast('Errore GPS: ' + err.message); btn.classList.remove('gps-active'); },
        { enableHighAccuracy: true, maximumAge: 1000 }
      );
    }
  </script>
</body>
</html>
